name: .NET Tests

on:
  push:
    branches: [desarrollo]
  pull_request:
    branches: [desarrollo]
  workflow_dispatch: # Permite disparar manualmente

jobs:
  test:
    runs-on: windows-latest

    steps:
      # 1. Checkout del repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      # 3. Restore dependencias (por si no hay artifact)
      - name: Restore dependencies
        run: dotnet restore

      # 4. Ejecutar tests directamente apuntando al proyecto de tests
      - name: Run Tests
        run: dotnet test ./CivitaBack.Tests/CivitaBack.Tests.csproj --configuration Release --logger "trx;LogFileName=test_results.trx"

      # 5. Subir resultados como artefacto
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test_results.trx"
